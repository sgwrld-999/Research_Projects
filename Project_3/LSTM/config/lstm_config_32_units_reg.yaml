# LSTM Model Configuration - 32 Units with Regularization
# =========================================================

# === Core Architecture Parameters ===
input_dim: 14 # Number of features per time step
seq_len: 64 # Number of time steps in sequence
num_classes: 5 # Classification categories
lstm_units: 32 # 32 units
num_layers: 2 # Stack depth

# === Regularization Configuration ===
dropout: 0.3 # Increased dropout (was 0.2)
bidirectional: true # Process sequences in both directions
weight_decay: 0.0001 # L2 regularization (1e-4)

# === Training Hyperparameters ===
learning_rate: 0.001 # Adam optimizer step size
batch_size: 64 # Batch size
epochs: 50 # Maximum training iterations
validation_split: 0.2 # Fraction for validation
early_stopping_patience: 10 # Stop if no improvement

# === Monitoring and Evaluation ===
metrics: # Performance metrics to track
  - accuracy
  - val_loss
  - precision
  - recall
  - f1_score

# === Model Persistence ===
export_path: "models/saved_Models/lstm_32_units_reg.keras"
